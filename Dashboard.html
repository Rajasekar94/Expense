<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Dashboard</title>
<style>

/* Navbar */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    box-sizing:border-box;
    background:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    box-shadow:0 2px 15px rgba(0,0,0,0.1);
    z-index:1000;
}
.logo{
    font-size:22px;
    font-weight:bold;
    color:#4f46e5;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:25px;
}

.nav-links a{
    text-decoration:none;
    color:#333;
    font-weight:600;
    transition:.3s;
}

.nav-links a:hover{
    color:#4f46e5;
}

.menu-toggle{
    display:none;
    font-size:28px;
    cursor:pointer;
}


body{
    font-family:Segoe UI,sans-serif;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    margin:0;
    overflow-x:hidden;
}

.container{
    max-width:1400px;
    margin:0 auto;
    padding:90px 20px 20px;
}

.section,.card{background:#fff;border-radius:15px;padding:20px;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th, td{
    padding:12px 15px;
    text-align:left;
}

th:last-child,
td:last-child{
    text-align:right;
}

#monthlyTable th:first-child,
#monthlyTable td:first-child{
    width:70%;
}

#monthlyTable th:last-child,
#monthlyTable td:last-child{
    width:30%;
}
select,input{padding:10px;width:100%;border:1px solid #ddd;border-radius:8px}

.table-container{
    overflow-x:auto;
}

@media (max-width:768px){

 .menu-toggle{
        display:block;
    }

    .nav-links{
        display:none;
        position:absolute;
        top:65px;
        left:0;
        width:100%;
        background:#fff;
        flex-direction:column;
        padding:15px;
        gap:15px;
        box-shadow:0 5px 10px rgba(0,0,0,.1);
    }

    .nav-links.active{
        display:flex;
    }

    .logo{
        font-size:18px;
    }


    #expenseTable,
    #expenseTable thead,
    #expenseTable tbody,
    #expenseTable th,
    #expenseTable td,
    #expenseTable tr{
        display:block;
        width:100%;
    }

    #expenseTable thead{
        display:none;
    }

    #expenseTable tr{
        background:#fff;
        margin-bottom:15px;
        border-radius:12px;
        padding:10px;
        box-shadow:0 2px 8px rgba(0,0,0,.1);
    }

    #expenseTable td{
        border:none;
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:8px 0;
        word-break:break-word;
    }

    #expenseTable td::before{
        font-weight:bold;
        color:#4f46e5;
    }

    #expenseTable td:nth-child(1)::before{
        content:"Timestamp";
    }

    #expenseTable td:nth-child(2)::before{
        content:"Date";
    }

    #expenseTable td:nth-child(3)::before{
        content:"Category";
    }

    #expenseTable td:nth-child(4)::before{
        content:"Amount";
    }
}



</style>
</head>
<body>

<!-- Navbar -->

<nav class="navbar">

    <div class="logo">💰 Expense Tracker</div>

    <ul class="nav-links">
        <li><a href="index.html">Add Expense</a></li>
        <li><a href="#">Reports</a></li>
        <li><a href="#">Dashboard</a></li>
    </ul>

    <div class="menu-toggle" onclick="toggleMenu()">
        ☰
    </div>

</nav>


<div class="container">
<div class="section">
<select id="monthFilter"><option value="ALL">All Months</option></select>
</div>

<div class="cards">
<div class="card"><h3>Total Expense</h3><h2 id="totalExpense">₹0</h2></div>
<div class="card"><h3>Selected Month</h3><h2 id="monthExpense">₹0</h2></div>
<div class="card"><h3>Transactions</h3><h2 id="totalEntries">0</h2></div>
<div class="card"><h3>Top Category</h3><h2 id="topCategory">-</h2></div>
</div>

<div class="section">
<h2>Category Summary</h2>
<table id="categoryTable"><thead><tr><th>Category</th><th>Total</th></tr></thead><tbody></tbody></table>
</div>

<div class="section">
<h2>Monthly Summary</h2>
<table id="monthlyTable"><thead><tr><th>Month</th><th>Total</th></tr></thead><tbody></tbody></table>
</div>

<div class="section">
<input type="text" id="search" placeholder="Search..."><br><br>
<div class="table-container">
<table id="expenseTable">
<thead><tr><th>Timestamp</th><th>Date</th><th>Category</th><th>Amount</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>
</div>

<script>

function toggleMenu(){
    document.querySelector(".nav-links").classList.toggle("active");
}


const SHEET_ID="1EToj1lX4yMWx8gn5whahNvu5cR-GE-nfBxJj8M27HdM";
const API_KEY="AIzaSyBFIUxT4z_JXnJufVtF7MLUNxF3rsE-3OY";
let allRows=[];

fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/Res!A:E?key=${API_KEY}`)
.then(r=>r.json())
.then(data=>{
 allRows=data.values.slice(1);
 populateMonths();
 renderDashboard("ALL");
});

function populateMonths(){
 const dd=document.getElementById("monthFilter");
 const months=[...new Set(allRows.map(r=>r[4]))];
 months.sort().reverse();
 months.forEach(m=>dd.innerHTML+=`<option value="${m}">${m}</option>`);
}

document.getElementById("monthFilter").addEventListener("change",e=>{
 renderDashboard(e.target.value);
});

function renderDashboard(selectedMonth){
 let rows=[...allRows];

 if(selectedMonth!=="ALL"){
   rows=rows.filter(r=>r[4]===selectedMonth);
 }

 let total=0,cats={},months={};

 rows.forEach(r=>{
   const amt=Number(r[3])||0;
   total+=amt;

   cats[r[2]]=(cats[r[2]]||0)+amt;
   months[r[4]]=(months[r[4]]||0)+amt;
 });

 document.getElementById("totalExpense").innerHTML="₹"+total.toFixed(2);
 document.getElementById("monthExpense").innerHTML="₹"+total.toFixed(2);
 document.getElementById("totalEntries").innerHTML=rows.length;

 let top="-",topAmt=0;
 Object.entries(cats).forEach(([k,v])=>{
   if(v>topAmt){topAmt=v;top=k;}
 });
 document.getElementById("topCategory").innerHTML=top;

 document.querySelector("#categoryTable tbody").innerHTML=
 Object.entries(cats).sort((a,b)=>b[1]-a[1])
 .map(([k,v])=>`<tr><td>${k}</td><td>₹${v.toFixed(2)}</td></tr>`).join("");

 document.querySelector("#monthlyTable tbody").innerHTML=
 Object.entries(months)
 .map(([k,v])=>`<tr><td>${k}</td><td>₹${v.toFixed(2)}</td></tr>`).join("");

 document.querySelector("#expenseTable tbody").innerHTML=
 rows.slice().reverse()
 .map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>₹${r[3]}</td></tr>`).join("");
}

document.getElementById("search").addEventListener("keyup",function(){
 const v=this.value.toLowerCase();
 document.querySelectorAll("#expenseTable tbody tr").forEach(tr=>{
   tr.style.display=tr.innerText.toLowerCase().includes(v)?"":"none";
 });
});
</script>
</body>
</html>
